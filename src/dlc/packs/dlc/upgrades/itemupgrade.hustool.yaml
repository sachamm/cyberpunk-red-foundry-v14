  description:
    value: |
      <p>
        Find odd jobs and get paid! Jobs take 30 minutes to complete and pay 10eb.
        Available jobs are determined by the GM, roll
        [[/r 1d10 #HusTool]]
      </p>
      <ul>
        <li>
          <p>
            <strong>On a 1:</strong> Factors outside of your control prevent you from
            finishing the errand.
          </p>
          <ul>
            <li><p>You waste your time and don't get paid.</p></li>
          </ul>
        </li>
        <li>
          <p>
            <strong>On a 10:</strong> The errand is completed, but you encounter
            trouble.
          </p>
          <ul>
            <li><p>GM rolls on an appropriate encounter table.</p></li>
          </ul>
        </li>
      </ul>
      <blockquote>
        <p>
          Install this App on your
          @UUID[Compendium.cyberpunk-red-core.core_gear.Item.GqYz689ddSKQHMen]{Agent}
        </p>
      </blockquote>

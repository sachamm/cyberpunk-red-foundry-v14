  description:
    value: |
      <p><strong>Primary Effect</strong> Dose lasts 4 hours.</p>
      <ul>
        <li>
          <p>
            The user feels happy and satisfied, receiving a temporary modifier of +2
            to <strong>Acting</strong>, <strong>Contortionist</strong>,
            <strong>Conversation</strong>, <strong>Dance</strong>,
            <strong>Human Perception</strong>, and <strong>Persuasion</strong>
          </p>
        </li>
      </ul>
      <hr />
      <p>
        <strong
          >Secondary Effect
          [[/r 1d10red+@stats.will+@skills.resistTortureOrDrugs #DV15 Resist Torture/Drugs]]{DV15 Resist Torture/Drugs}</strong
        >
      </p>
      <ul>
        <li>
          <p>
            While addicted, user suffers a -2 modifier to <strong>Acting</strong>,
            <strong>Contortionist</strong>, <strong>Conversation</strong>,
            <strong>Dance</strong>, <strong>Human Perception</strong>, and
            <strong>Persuasion</strong>
          </p>
        </li>
      </ul>
      <blockquote>
        <p>GM will tell you when you crave more Smash. Roleplay accordingly.</p>
      </blockquote>

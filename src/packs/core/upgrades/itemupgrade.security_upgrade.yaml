  description:
    value: |
      <p>
        Adds DNA Locks to the vehicle requiring the correct biometrics or a
        [[/r 1d10red+@stats.tech+@skills.electronicsOrSecurityTech #DV17 Electronics/Security Tech]]{DV17 Electronics/Security Tech}
        check to unlock. An individual who fails to unlock the vehicle takes damage as
        if hit with a
        @UUID[Compendium.cyberpunk-red-core.core_weapons.Item.O1brHdazB6mqbVp1]{Stun Baton}.
      </p>
      <p>
        After remaining stationary for 1 minute, the vehicle is cloaked and requires a
        [[/r 1d10red+@stats.int+@skills.perception #DV17 Perception]]{DV17 Perception}
        check to spot.
      </p>
      <blockquote>
        <p><strong>Moto Rank Required:</strong> 5</p>
        <p><strong>Availability:</strong> All Vehicles</p>
      </blockquote>
